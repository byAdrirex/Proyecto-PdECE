<div class="bg-white rounded-xl shadow-md p-8 border border-gray-100 text-center max-w-lg mx-auto">
    <h2 class="text-xl font-semibold text-gray-700 mb-2">
        &iquest;Quieres cargar tu Kardex o seleccionar materias manualmente?
    </h2>
    <p class="text-sm text-gray-400 mb-6">
        As&iacute; armaremos tu horario seg&uacute;n tu historial acad&eacute;mico.
    </p>
    <div class="space-y-4">
        <button hx-post="/horario/parcial/seleccionar-modo"
                hx-vals='{"modo": "academico"}'
                hx-target="#zona-modo"
                hx-swap="innerHTML"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-4 px-6 rounded-xl transition text-lg">
            Cargar Kardex
        </button>
        <button hx-get="/horario/kardex/manual"
                hx-target="#zona-modo"
                hx-swap="innerHTML"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 px-6 rounded-xl transition text-lg">
            Seleccionar manualmente
        </button>
    </div>
    <div class="mt-6 border-t border-gray-100 pt-6">
        <p class="text-sm text-gray-500 mb-3">
            &iquest;Eres estudiante nuevo o prefieres no cargar tu Kardex?
        </p>
        <button hx-post="/horario/parcial/seleccionar-modo"
                hx-vals='{"modo": "manual", "destino": "horario"}'
                hx-target="#zona-modo"
                hx-swap="innerHTML"
                class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-xl transition text-sm">
            Soy nuevo / No quiero cargar Kardex
        </button>
    </div>
    <p class="text-sm text-gray-400 mt-6">
        El modo manual no verifica prerrequisitos.
        El modo kardex verifica tu historial acad&eacute;mico.
    </p>
</div>
